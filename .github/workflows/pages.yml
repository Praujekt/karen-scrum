name: Publish static frontend to GitHub Pages

# Publishing is deliberately manual. A source push never deploys this project.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only the static frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish frontend
        id: deployment
        uses: actions/deploy-pages@v4
